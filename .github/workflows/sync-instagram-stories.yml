name: Sincronizar Stories da Inovar Elevada

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Sincronizar Stories
        env:
          INSTAGRAM_USER_ID: ${{ secrets.INSTAGRAM_USER_ID }}
          INSTAGRAM_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN }}
          INSTAGRAM_API_VERSION: v23.0
        run: node scripts/sync-instagram-stories.mjs
      - name: Publicar conteúdo atualizado no repositório
        run: |
          git config user.name "inovar-elevada-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/stories.json assets/stories assets/profile.jpg || true
          git diff --cached --quiet && exit 0
          git commit -m "chore: atualizar stories do Instagram"
          git push
